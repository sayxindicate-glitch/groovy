<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Bot Remote Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">🤖 Bot Remote Control</h2>
        
        <form id="botForm" class="space-y-4">
            <!-- ON / OFF Switch -->
            <div class="flex items-center justify-between bg-gray-700 p-3 rounded-lg">
                <label class="font-semibold">Status Bot</label>
                <select id="status" class="bg-gray-900 text-white font-bold p-2 rounded outline-none border border-gray-600 focus:border-blue-500">
                    <option value="ON" class="text-green-500">🟢 ON (Trading)</option>
                    <option value="OFF" class="text-red-500">🔴 OFF (Berhenti)</option>
                </select>
            </div>

            <!-- Parameters -->
            <div>
                <label class="block text-sm text-gray-400">Lot Size (Sekali Entry)</label>
                <input type="number" step="0.01" id="lotSize" class="w-full mt-1 p-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500" required>
            </div>
            
            <div>
                <label class="block text-sm text-gray-400">Jumlah Eksekusi (Layer)</label>
                <input type="number" id="jumlahEksekusi" class="w-full mt-1 p-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-400">Stop Loss (Poin)</label>
                    <input type="number" id="stopLoss" class="w-full mt-1 p-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-400">Take Profit (Poin)</label>
                    <input type="number" id="takeProfit" class="w-full mt-1 p-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500" required>
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-400">Magic Number</label>
                <input type="number" id="magicNumber" class="w-full mt-1 p-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition mt-4">
                🚀 Update Parameter ke Bot
            </button>
            <p id="statusMsg" class="text-center text-sm mt-2 font-semibold"></p>
        </form>
    </div>

    <script>
        const API_URL = "https://expert666.akranetendoi.workers.dev/";

        // Ambil data saat ini ketika halaman dimuat
        async function fetchConfig() {
            try {
                let res = await fetch(API_URL);
                let data = await res.json();
                document.getElementById('status').value = data.status;
                document.getElementById('lotSize').value = data.lotSize;
                document.getElementById('jumlahEksekusi').value = data.jumlahEksekusi;
                document.getElementById('stopLoss').value = data.stopLoss;
                document.getElementById('takeProfit').value = data.takeProfit;
                document.getElementById('magicNumber').value = data.magicNumber;
            } catch (e) {
                console.error("Gagal mengambil data", e);
            }
        }

        // Kirim update saat tombol ditekan
        document.getElementById('botForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.submitter;
            const msg = document.getElementById('statusMsg');
            
            btn.innerText = "⏳ Menyimpan...";
            
            const payload = {
                status: document.getElementById('status').value,
                lotSize: parseFloat(document.getElementById('lotSize').value),
                jumlahEksekusi: parseInt(document.getElementById('jumlahEksekusi').value),
                stopLoss: parseInt(document.getElementById('stopLoss').value),
                takeProfit: parseInt(document.getElementById('takeProfit').value),
                magicNumber: parseInt(document.getElementById('magicNumber').value)
            };

            try {
                let res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let result = await res.json();
                msg.innerText = result.message;
                msg.className = "text-center text-sm mt-2 font-semibold text-green-400";
            } catch (err) {
                msg.innerText = "Gagal menyimpan!";
                msg.className = "text-center text-sm mt-2 font-semibold text-red-400";
            }
            
            btn.innerText = "🚀 Update Parameter ke Bot";
            setTimeout(() => msg.innerText = "", 3000);
        });

        fetchConfig();
    </script>
</body>
</html>
